{% load static %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EventFlow{% endblock %} - Smart Event Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <script>
        // Set theme before paint to avoid flash of unstyled content.
        (function() {
            try {
            var saved = localStorage.getItem("darkMode");
            if (saved === "false") {
                document.documentElement.classList.remove("dark");
            } else {
                document.documentElement.classList.add("dark");
            }
            } catch (e) {
            // localStorage unavailable (private mode, etc.) — default to dark
            document.documentElement.classList.add("dark");
            }
        })();
    </script>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-surface-50 dark:bg-surface-950 text-surface-900 dark:text-surface-50 font-sans antialiased transition-colors duration-300">
    {% block body %}{% endblock %}

    <div id="toast-container" class="fixed top-4 right-4 z-[100] space-y-2"></div>

    {% if messages %}
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            {% for message in messages %}
            showToast("{{ message|escapejs }}", "{{ message.tags }}");
            {% endfor %}
        });
    </script>
    {% endif %}

    <script src="{% static 'js/app.js' %}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
