{% extends "base_dashboard.html" %}
{% block title %}Check your email{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-16">
  <div class="w-full max-w-md">

    <div class="relative rounded-2xl border border-white/10 bg-ink-900 overflow-hidden">
      <div class="absolute top-0 left-0 right-0 h-0.5 bg-lime2-500"></div>

      <div class="p-8 text-center">
        <div class="w-14 h-14 rounded-2xl bg-lime2-500/15 border border-lime2-500/30 grid place-items-center mx-auto mb-5 text-lime2-500">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </div>
        <h1 class="font-display text-3xl leading-tight mb-3">Check your email</h1>
        <p class="text-sm text-ink-400 mb-6">
          If an account exists with that email, we've sent a password reset link. It should arrive within a minute.
        </p>
        <a href="{% url 'login' %}"
           class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-flame-600 hover:bg-flame-500 text-ink-950 text-sm font-semibold transition">
          Back to sign in
        </a>
      </div>
    </div>

  </div>
</div>
{% endblock %}
