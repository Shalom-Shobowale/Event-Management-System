{% load static %}
<!doctype html>
<html lang="en" class="scroll-smooth dark" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password · EventzUp</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favIcon.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    // Auth pages are always dark — lock it before paint.
    document.documentElement.classList.add("dark");
  </script>
  <link rel="stylesheet" href="{% static 'css/app.css' %}" />
</head>

<body class="min-h-screen bg-ink-950 text-ink-50 font-sans antialiased">

  <div class="min-h-screen flex items-center justify-center px-4 py-16">
    <div class="w-full max-w-md">

      <!-- logo -->
      <div class="flex justify-center mb-8">
        <img src="{% static 'images/logoz1.png' %}" alt="EventzUp" class="h-8 w-auto" />
      </div>

      <!-- card -->
      <div class="relative rounded-2xl border border-white/10 bg-ink-900 overflow-hidden">
        <div class="absolute top-0 left-0 right-0 h-0.5 bg-flame-600"></div>

        <div class="relative p-8">
          <p class="font-mono text-[10px] uppercase tracking-widest text-flame-400 mb-2">Password reset</p>
          <h1 class="font-display text-3xl leading-tight mb-2">Forgot your password?</h1>
          <p class="text-sm text-ink-400 mb-8">
            Enter your email and we'll send you a link to set a new password.
          </p>

          <form method="post" class="space-y-5">
            {% csrf_token %}

            <div>
              <label for="id_email" class="ef-label">Email address</label>
              <input type="email" name="email" id="id_email" required autocomplete="email"
                     class="ef-input"
                     placeholder="you@example.com" />
            </div>

            <button type="submit"
                    class="w-full inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl bg-flame-600 hover:bg-flame-500 text-white font-semibold transition">
              Send reset link
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
              </svg>
            </button>

            <a href="{% url 'login' %}"
               class="block text-center text-sm text-ink-400 hover:text-flame-500 transition">
              Back to sign in
            </a>
          </form>
        </div>
      </div>

      <p class="mt-6 text-center font-mono text-[10px] uppercase tracking-widest text-ink-500">
        © 2026 EventzUp
      </p>

    </div>
  </div>

  <script src="{% static 'js/app.js' %}?v=3"></script>
</body>
</html>
