{% load static %}
<!doctype html>
<html lang="en" class="scroll-smooth dark" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check your email · EventzUp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    document.documentElement.classList.add("dark");
  </script>
  <link rel="stylesheet" href="{% static 'css/app.css' %}" />
</head>

<body class="min-h-screen bg-ink-950 text-ink-50 font-sans antialiased">

  <div class="min-h-screen flex items-center justify-center px-4 py-16">
    <div class="w-full max-w-md">

      <div class="flex justify-center mb-8">
        <img src="{% static 'images/logoz1.png' %}" alt="EventzUp" class="h-8 w-auto" />
      </div>

      <div class="relative rounded-2xl border border-white/10 bg-ink-900 overflow-hidden">
        <div class="absolute top-0 left-0 right-0 h-0.5 bg-lime2-500"></div>

        <div class="p-8 text-center">
          <div class="w-14 h-14 rounded-2xl bg-lime2-500/15 border border-lime2-500/30 grid place-items-center mx-auto mb-5 text-lime2-500">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
          </div>
          <h1 class="font-display text-3xl leading-tight mb-3">Check your email</h1>
          <p class="text-sm text-ink-400 mb-6">
            If an account exists with that email, we've sent a password reset link. It should arrive within a minute.
          </p>
          <a href="{% url 'login' %}"
             class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-flame-600 hover:bg-flame-500 text-white text-sm font-semibold transition">
            Back to sign in
          </a>
        </div>
      </div>

      <p class="mt-6 text-center font-mono text-[10px] uppercase tracking-widest text-ink-500">
        © 2026 EventzUp
      </p>

    </div>
  </div>

  <script src="{% static 'js/app.js' %}?v=3"></script>
</body>
</html>
