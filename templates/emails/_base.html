{% load static %}
<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}EventzUp{% endblock %}</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favIcon.png' %}">
</head>
<body style="margin:0;padding:0;background-color:#f6f6f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;">

  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f6f6f8;">
    <tr>
      <td align="center" style="padding:32px 16px;">

        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:560px;background-color:#ffffff;border:1px solid #e9e9ee;border-radius:16px;overflow:hidden;">

          <tr>
            <td style="height:3px;background:linear-gradient(90deg,#ff4800 0%,#ff5a1f 50%,#7c5cff 100%);"></td>
          </tr>

          <tr>
            <td style="padding:28px 32px 16px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="vertical-align:middle;">
                    <img src="https://eventzup.com/static/images/Logoz2.png" alt="EventzUp" width="120" style="display:block;width:120px;height:auto;border:0;outline:none;" />
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="padding:8px 32px 32px;color:#4d4d66;font-size:15px;line-height:1.6;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <tr>
            <td style="padding:0 32px;">
              <div style="border-top:1px solid #e9e9ee;"></div>
            </td>
          </tr>

          <tr>
            <td style="padding:20px 32px 28px;color:#71718a;font-size:12px;line-height:1.5;">
              <p style="margin:0 0 8px 0;">
                {% block footer %}{% endblock %}
              </p>
              <p style="margin:0;font-family:'Courier New',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:#a0a0b3;">
                Sent by EventzUp
              </p>
            </td>
          </tr>

        </table>

        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:560px;margin-top:20px;">
          <tr>
            <td align="center" style="color:#a0a0b3;font-size:11px;line-height:1.5;">
              © {% now "Y" %} EventzUp. All rights reserved.
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>
</html>
