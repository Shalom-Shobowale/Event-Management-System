{% comment %}
Global report modal. Include ONCE in base_dashboard.html, above the
<script src="app.js"> tag.
{% endcomment %}

<div id="report-modal"
     class="fixed inset-0 z-[200] hidden"
     aria-hidden="true"
     tabindex="-1"
     role="dialog"
     aria-modal="true"
     aria-labelledby="report-modal-title">
    <div class="absolute inset-0 bg-ink-950/70 backdrop-blur-sm" data-report-close></div>

    <div class="relative mx-auto mt-16 max-w-lg px-4">
        <div class="relative rounded-2xl border border-white/10 bg-ink-900 overflow-hidden shadow-2xl shadow-black/60">
            <div class="absolute top-0 left-0 right-0 h-0.5 bg-flame-600"></div>
            <div class="absolute -top-24 -right-24 w-56 h-56 rounded-full glow-flame pointer-events-none opacity-40"></div>

            <div class="relative p-5 border-b border-white/5 flex items-start justify-between gap-4">
                <div>
                    <p class="font-mono text-[10px] uppercase tracking-widest text-flame-400 mb-1">Report</p>
                    <h3 class="font-display text-2xl leading-tight">Something wrong?</h3>
                    <p class="text-sm text-ink-400 mt-1">
                        Reported: <span id="report-target-label" class="text-ink-200">—</span>
                    </p>
                </div>
                <button type="button"
                        class="p-1.5 rounded-lg text-ink-400 hover:text-ink-100 hover:bg-white/5 transition"
                        data-report-close
                        aria-label="Close">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <form id="report-form"
                  method="post"
                  action="{% url 'reports:create' %}"
                  class="relative p-5 space-y-5">
                {% csrf_token %}

                <input type="hidden" name="target_type" id="report-target-type">
                <input type="hidden" name="target_id" id="report-target-id">
                <input type="hidden" name="target_label" id="report-target-label-input">

                <div>
                    <label class="block font-mono text-[10px] uppercase tracking-widest text-ink-500 mb-2">
                        What's the issue?
                    </label>
                    <div id="report-categories" class="grid grid-cols-1 gap-2"></div>
                </div>

                <div>
                    <label for="report-reason"
                           class="block font-mono text-[10px] uppercase tracking-widest text-ink-500 mb-2">
                        Tell us what happened
                    </label>
                    <textarea id="report-reason"
                              name="reason"
                              rows="5"
                              minlength="30"
                              maxlength="2000"
                              required
                              placeholder="Be specific. Include dates, names, or links if relevant."
                              class="w-full px-3 py-2.5 rounded-lg border border-white/10 bg-ink-950/50 text-sm text-ink-100 placeholder-ink-600 focus:border-flame-600 focus:bg-flame-600/5 focus:ring-4 focus:ring-flame-600/12 outline-none transition resize-none"></textarea>
                    <div class="flex items-center justify-between mt-1.5">
                        <p class="font-mono text-[10px] uppercase tracking-widest text-ink-600">
                            Min 30 characters
                        </p>
                        <p class="font-mono text-[10px] text-ink-600">
                            <span id="report-char-count">0</span>/2000
                        </p>
                    </div>
                </div>

                <div id="report-error"
                     class="hidden rounded-lg border border-flame-600/40 bg-flame-600/10 text-flame-400 text-sm p-3"></div>

                <div class="flex items-center justify-between gap-3 pt-2 border-t border-white/5">
                    <p class="font-mono text-[10px] uppercase tracking-widest text-ink-600">
                        Limit 3 per day
                    </p>
                    <div class="flex items-center gap-2">
                        <button type="button"
                                class="px-4 py-2 text-sm text-ink-300 hover:text-ink-100 transition"
                                data-report-close>
                            Cancel
                        </button>
                        <button type="submit"
                                id="report-submit"
                                class="inline-flex items-center gap-2 px-5 py-2 rounded-lg bg-flame-600 hover:bg-flame-500 text-ink-950 text-sm font-semibold transition disabled:opacity-50 disabled:cursor-not-allowed">
                            <span id="report-submit-text">Submit report</span>
                            <svg id="report-submit-spinner"
                                 class="hidden w-3.5 h-3.5 animate-spin"
                                 fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"/>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </form>

            <div id="report-success" class="hidden p-8 text-center">
                <div class="inline-flex flex-col items-center gap-3">
                    <div class="w-14 h-14 rounded-2xl bg-lime2-500/15 border border-lime2-500/30 grid place-items-center text-lime2-500">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                        </svg>
                    </div>
                    <h3 class="font-display text-2xl">Report received</h3>
                    <p class="text-sm text-ink-400 max-w-xs">
                        We'll review it shortly. Thanks for helping keep the platform safe.
                    </p>
                    <button type="button"
                            class="mt-2 px-5 py-2 rounded-lg bg-flame-600 hover:bg-flame-500 text-ink-950 text-sm font-semibold transition"
                            data-report-close>
                        Done
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
